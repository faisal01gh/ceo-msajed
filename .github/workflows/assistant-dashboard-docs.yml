name: Assistant dashboard documentation sync
on:
  push:
    branches: [docs/assistant-dashboard-delivery-20261012]
permissions:
  contents: write
jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Record exact verified delivery without changing runtime
        run: |
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const heading='## متابعة المساعد وتبسيط خانات المدة — منشور ومتحقق 2026-10-12';
          const section=[heading,'',
          '- الواجهة القديمة فقط: صندوق «المهام المتأخرة» وصندوق «المعاملات الواردة» في مكتبي ولوحة المساعد وسكرتيره، بعدادات مستقلة وبحث وعرض خمسة عناصر لكل صفحة وفتح مباشر للإجراءات الحالية. بقيت أقسام الفريق والاعتمادات والمهام الخاصة والتقارير وصناديق إدارات فهد دون إلغاء.',
          '- متأخرات المتابعة خمسة أيام فأكثر من آخر تحديث أو تاريخ الإسناد عند غيابه، مع استبعاد المغلق والمرفوع للرئيس والموقوف مؤقتًا. الوارد يتبع المرحلة الحالية لدى المساعد، ولا يشمل المحال لغيره أو المؤرشف أو المنتهي أو المردود عليه. المصدر هو بيانات الحساب المصرح بها أصلًا، بلا قراءة إضافية أو تغيير للصلاحيات.',
          '- بتوجيه فيصل أزيلت العبارات الزائدة من خانات المدة في المكتب والقطاعات وتقارير العرض: عدد الأيام فقط بدل «موقوفة مؤقتًا · لا تُصنّف متأخرة» أو «مستمرة». تبقى الحالة وأسبابها في مواضعها وسجلها، ويستمر عداد الإسناد وقواعد استثناء التأخر واعتماد الاستئناف دون تغيير.',
          '- المرجع الأحدث لهذا العرض: `docs/tasks/ASSISTANT_DASHBOARD_2026-10-12.md`؛ لا يغير مواصفات النظام الجديد أو نموذج أدواره.',
          '- مصدر التنفيذ: `2a2333f039bf57890113d99f9ca41da06c213337` في `ceo-office-tasks`، PR #2. إعادة النشر `d807fddacd589988ebdcac8ae0519395004495cb` لا تغير أي ملف؛ شجرة المصدر نفسها `8e43bde7b08240566d9c7b18e9f50cb6c4144825`.',
          '- البناء الحالي: portal `20261012-assistant-dashboard-v1`، CEO `20261012-duration-clean-v5`. إضافة متابعة مكتب الرئيس بقيت `20261012-office-custody-v4` والخلفية لم تتغير في هذا التسليم.',
          '- التحقق: 75 تحققًا ناجحًا (40 منطق/parse و35 متصفح)، في الكمبيوتر 1440×1100 والجوال 390×844، صفر أخطاء صفحة وصفر طلبات شبكة خارجية في البيانات المصطنعة. run المصدر 38248332100؛ run النشر 38248549012، المحاولة الثانية ناجحة والوظيفة 114810773693.',
          '- تعثرت محاولة Cloudflare الأولى 668d1800-9c08-40bd-ad5f-f1ca84e8b734؛ نجحت إعادة نشر المصدر نفسه eaf1db2b-5c95-4752-9ca9-215e2837b847. قراءة الرابط الرئيسي أثبتت تطابق بايتات ملفات HTML للصفحتين وJS/CSS الإضافة مع Git، مع تهيئة الصفحتين العامة دون جلسة وبلا أخطاء أو طلبات كتابة.',
          '- لم تتغير قاعدة البيانات أو Edge Functions أو Auth أو RLS أو أي مهمة أو معاملة حقيقية لأغراض الاختبار. اختبار الأزرار استخدم بيانات معزولة وإجراءات بديلة مرصودة، وليس تحديثًا أو ردًا حقيقيًا.',
          '- الأدلة: https://github.com/faisal01gh/ceo-office-tasks/pull/2 وhttps://github.com/faisal01gh/ceo-office-tasks/actions/runs/38248549012/attempts/2 .',''].join('\n');
          const paths=['docs/HANDOFF.md','docs/PROJECT_STATE.md','docs/tasks/LEGACY_INVENTORY.md','CHANGELOG.md'];
          for(const path of paths){
            let body=fs.readFileSync(path,'utf8');assert.ok(!body.includes(heading),'Duplicate delivery');
            const at=body.indexOf('\n## ');assert.ok(at>=0,'Missing heading in '+path);
            body=body.slice(0,at)+'\n'+section+'\n'+body.slice(at+1);
            fs.writeFileSync(path,body);
          }
          const spec='docs/tasks/ASSISTANT_DASHBOARD_2026-10-12.md';
          let body=fs.readFileSync(spec,'utf8');
          const previous='الحالة: معتمد؛ التنفيذ والتحقق جاريان، ولا يعد منشورًا من هذا القرار وحده.';
          assert.ok(body.includes(previous));
          body=body.replace(previous,'الحالة: منشور ومتحقق على الرابط الرئيسي بتاريخ 2026-10-12؛ التحقق على بيانات مصطنعة معزولة وعلى الملفات العامة، وليس تنفيذ إجراء كتابة على بيانات حقيقية.');
          body+='\n\n'+section+'\n### بصمات النشر الحي\n\n'+[
            '- `portal/index.html`: `6c6949eb23bbb18c9b3f518cdbe696110d9189ff195a30d3a23316f93f387223`.',
            '- `portal/assistant-dashboard.js`: `5bc490423f305174cc6553f0f79427403e8b5a10084b6c48b2f083d7d33dbed5`.',
            '- `portal/assistant-dashboard.css`: `496adfeef4e34ac29eeaa583f4b9bbf652ef2502ecdc88dbd477cd3c4629ae53`.',
            '- `ceo/index.html`: `2abf1b3388c0266acba0f01e7d886a4c29b1332e021bc797e6bad6f981e0984a`.'
          ].join('\n')+'\n';
          fs.writeFileSync(spec,body);
          fs.unlinkSync('.github/workflows/assistant-dashboard-docs.yml');
          console.log('Updated five documentation files only; temporary workflow removed.');
          JS
          git diff --check
          git diff --stat
          git config user.name "documentation-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HANDOFF.md docs/PROJECT_STATE.md docs/tasks/LEGACY_INVENTORY.md docs/tasks/ASSISTANT_DASHBOARD_2026-10-12.md CHANGELOG.md .github/workflows/assistant-dashboard-docs.yml
          git commit -m "Document verified assistant dashboard and concise task durations"
          git push origin HEAD:refs/heads/docs/assistant-dashboard-delivery-20261012
