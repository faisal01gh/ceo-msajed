name: Record verified legacy task approval recovery
on:
  push:
    branches: [docs/approval-integrity-closure-20261022]
    paths: ['.github/workflows/document-approval-integrity-once.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Prepend verified entries and retain all prior content
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const heading='## 2026-10-22 — استعادة إجراءات فهد وحماية الاعتماد في النظام القديم';
          const body=[heading,'',
            '- نفذ تفويض فيصل بتاريخ 2026-10-22: استعادة إجراء الحوكمة وإجراء مشروع الاستراتيجية من النصين الأصليين بتاريخ 2026-10-21؛ الأعداد 14→15 و11→12. rev 18257→18258 وAudit 1220/1221؛ قراءة لاحقة عند rev 18262 أثبتت عدم التكرار وبقاء الاعتماد الأصلي.',
            '- إجراء «تقرير المشاريع مع الجهات» بتاريخ 2026-10-22 ناتج عن طلب جديد مستقل أرسله فهد اليوم؛ بقي تاريخه ومحتواه دون تغيير. لم تُضف استعادة ثالثة خارج النطاق المحدد.',
            '- طُبقت migration 20261022113559_legacy_task_approval_integrity على msajed-tasks فقط: حفظ الإجراء والاعتماد والتاريخ والتدقيق في معاملة واحدة، وحماية الإجراءات المرتبطة بالطلبات من إسقاطها بحفظ نسخة أقدم.',
            '- الواجهة تنتظر تأكيد الخادم وتحافظ على التعديلات الجارية. PR #8 مدمج في ceo-office-tasks عند 1c77da51edc02b75bf5d6746518e50904491bfce. نجحت 91 حالة اختبار معزولة، ومطابقة ملفي الواجهة الحيين في run 39773632748؛ لا اختبار كتابة تجريبي على مهام حقيقية.',
            '- لا تغيير للنظام الجديد أو الحسابات والصلاحيات العامة. راجع حدود الحماية وتوصيات Advisors المتبقية في المواصفة؛ لا ادعاء بمعالجة جميع تعارضات JSON القديم أو قياس Egress.',
            '- المرجع الحاكم: `docs/tasks/APPROVAL_INTEGRITY_2026-10-22.md`.',
            '- الأدلة: https://github.com/faisal01gh/ceo-office-tasks/pull/8 وhttps://github.com/faisal01gh/ceo-office-tasks/actions/runs/39773632748',''].join('\n');
          for(const p of ['CHANGELOG.md','docs/HANDOFF.md','docs/tasks/LEGACY_INVENTORY.md']){
            const before=fs.readFileSync(p,'utf8');
            assert.ok(!before.includes(heading),'Entry already exists: '+p);
            let retained=before;
            if(p==='CHANGELOG.md'){
              const old='تحقق نشر Cloudflare الحي وقياس أثر الاستهلاك بعد النشر **لم يثبتا بعد**، ولا يدّعى اكتمال QA الشامل.';
              assert.equal(retained.split(old).length-1,1,'Prior egress verification statement must match once');
              retained=retained.replace(old,'تحقق نشر الواجهة الحي أُقفل لاحقًا في 2026-10-22 بمطابقة الملف كاملًا في run 39773632748؛ قياس أثر الاستهلاك الفعلي بعد النشر واختبار QA الشامل ما زالا غير مثبتين.');
            }
            const at=retained.startsWith('# ')?retained.indexOf('\n')+1:0;
            const addition='\n'+body+'\n';
            const after=retained.slice(0,at)+addition+retained.slice(at);
            assert.equal(after.slice(0,at)+after.slice(at+addition.length),retained);
            fs.writeFileSync(p,after);
            console.log(p+': prior content retained; verified entry added');
          }
          JS
          git diff --check
          git diff --stat
          git config user.name "project-documentation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/HANDOFF.md docs/tasks/LEGACY_INVENTORY.md
          git commit -m "Document verified legacy action recovery and atomic approval release"
          git push origin HEAD:refs/heads/docs/approval-integrity-closure-20261022
