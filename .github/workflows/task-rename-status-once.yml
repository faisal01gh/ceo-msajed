name: Record task rename status
on:
  push:
    branches: [docs/task-rename-status-20261013]
    paths: ['.github/workflows/task-rename-status-once.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Preserve existing documents and record pending feature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          entry = '''## 2026-10-13 — طلب تعديل اسم المهمة بموافقة مدير المكتب: معتمد وغير منفذ

          - اعتمد فيصل إتاحة طلب تعديل اسم المهمة لفهد الرشيد وفيصل الزكري ضمن نطاقهما الحالي؛ لا يتغير الاسم قبل موافقة مدير مكتب الرئيس التنفيذي.
          - بطاقة الاعتماد تعرض الاسم الحالي والمقترح وطالب التعديل؛ الموافقة تحفظ الاسم القديم والجديد في الإجراءات والتدقيق، والرفض يبقي الاسم الحالي.
          - راجعت الجلسة المستودع وبيانات الهوية والدور للحسابين وروابط العناوين القديمة قراءة فقط. لم تضف أو تنشر الخاصية ولم تعدل أي مهمة أو حساب أو Edge Function أو مخطط قاعدة بيانات.
          - المرجع: `docs/tasks/TASK_RENAME_APPROVAL_2026-10-13.md`. لا تعتبر هذه الوثيقة إثباتًا للتنفيذ؛ يلزم الكود والاختبارات المعزولة والتحقق من النشر أولًا.

          '''
          entry = '\n'.join(line[10:] if line.startswith('          ') else line for line in entry.split('\n'))
          files = ['CHANGELOG.md', 'docs/HANDOFF.md', 'docs/PROJECT_STATE.md']
          for name in files:
              path = Path(name)
              original = path.read_text(encoding='utf-8')
              heading, separator, remainder = original.partition('\n')
              assert separator and heading.startswith('# '), name
              assert '## 2026-10-13 — طلب تعديل اسم المهمة بموافقة مدير المكتب: معتمد وغير منفذ' not in original, name
              updated = heading + '\n\n' + entry + remainder
              assert original == updated.replace('\n' + entry, '', 1), name
              path.write_text(updated, encoding='utf-8')
          Path('.github/workflows/task-rename-status-once.yml').unlink()
          PY
          git diff --check
          git diff --stat
          git add CHANGELOG.md docs/HANDOFF.md docs/PROJECT_STATE.md .github/workflows/task-rename-status-once.yml
          git config user.name "project-documentation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record approved rename request without claiming implementation [CF-Pages-Skip]"
          git push origin HEAD:refs/heads/docs/task-rename-status-20261013
          git rev-parse HEAD
